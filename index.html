  <script>
    // Configuration & State
    let SUPABASE_URL = "https://tvxngammtltditnnsokn.supabase.co";
    let SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2eG5nYW1tdGx0ZGl0bm5zb2tuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMDkyMTEsImV4cCI6MjEwNTg4NTIxMX0.Q9Dav40O7-CAT1IcKVMW2s62QvQfCrR8HauxYNR66Gs";
    let IS_DEMO = false;

    let supabaseClient = null;
    let currentValidatedWorker = null;

    // Local Demo Data
    const demoWorkers = [
      {
        dni: "70904461",
        nombre_completo: "Fabricio Joel Miranda Quezada",
        codigo_casa: "M012",
        propietario: "REGGIARDO GILL Soraya Consuelo",

        fecha_vencimiento: new Date().toISOString().split('T')[0], // Expires today -> ACTIVO
        aseguradora: "Pacífico",
        activo: true
      },
      {
        dni: "12345678",
        nombre_completo: "Juan Pérez Obrero",
        codigo_casa: "M005",
        propietario: "MEJIA INFANTE Alejandro",
        fecha_inicio: "2026-01-01",
        fecha_vencimiento: "2026-08-15", // Expired
        aseguradora: "Rimac SCTR",
        activo: true
      }
    ];

    let demoHistory = [
      {
        id: 101,
        created_at: new Date(Date.now() - 3600000 * 2).toISOString(), // 2 hours ago
        fecha_salida: null,
        dni: "4015555",
        nombre_trabajador: "Carolina Toro",

        propietario: "VARGAS Oscar",

        motivo: "SCTR OK"
      }
    ];

    function initSupabase() {
      if (SUPABASE_KEY && !IS_DEMO) {
        try {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          updateBadgeStatus(true);
        } catch (e) {
          console.error("Error al iniciar Supabase:", e);
          updateBadgeStatus(false);
        }
      } else {
        supabaseClient = null;
        updateBadgeStatus(false);
      }
    }

    function updateBadgeStatus(connected) {
      const badge = document.getElementById("connectionBadge");
      if (connected) {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span><span>Supabase</span>`;
      } else {
        badge.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20";
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span><span>Demo</span>`;
      }
    }

    function playAudioFeedback(isOk) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (isOk) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime); // A3
          osc.frequency.setValueAtTime(164.81, ctx.currentTime + 0.12); // E3
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }

        // Cierra el contexto de audio liberando la memoria del teléfono
        setTimeout(() => {
          if (ctx.state !== 'closed') {
            ctx.close();
          }
        }, 400);

      } catch (e) { }
    }

    // Función para formatear fechas de "YYYY-MM-DD" a "DD de [mes]"
    function formatearFechaTexto(fechaString) {
      if (!fechaString) return '---';

      const fecha = new Date(fechaString + 'T00:00:00');
      const opciones = { day: '2-digit', month: 'long' };

      // Convierte la fecha a texto y reemplaza cualquier guion por un espacio
      return fecha.toLocaleDateString('es-PE', opciones).replace(/-/g, ' ');
    }

    async function validarDNI() {
      const input = document.getElementById("dniInput");
      const dni = input.value.trim();
      const container = document.getElementById("resultadoContainer");

      // Declaración explícita de variables
      let worker = null;
      let propietario = "No asignado";

      if (supabaseClient && !IS_DEMO) {
        // Query trabajadores_sctr
        const { data: workerData, error } = await supabaseClient
          .from('trabajadores_sctr')
          .select('*')
          .eq('dni', dni)
          .maybeSingle();

        if (workerData) {
          worker = workerData;
          // Query directorio para obtener el nombre del dueño
          if (worker.codigo_casa) {
            const codigoLimpio = worker.codigo_casa.trim();

            let { data: dirData, error: dirErr } = await supabaseClient
              .from('directorio')
              .select('*')
              .ilike('Codigo', codigoLimpio)
              .maybeSingle();

            if (dirErr) {
              const { data: dirDataAlt } = await supabaseClient
                .from('directorio')
                .select('*')
                .ilike('codigo', codigoLimpio)
                .maybeSingle();
              dirData = dirDataAlt;
            }

            if (dirData) {
              propietario = dirData.Propietario || dirData.propietario || "No asignado";
            }
          }
        }
      } else {
        // Local Demo Mode
        const found = demoWorkers.find(w => w.dni === dni);
        if (found) {
          worker = { ...found };
          propietario = found.propietario;
        }
      }

      renderResultadoCard(worker, propietario, dni);
    }

    function renderResultadoCard(worker, propietario, dni) {
      const container = document.getElementById("resultadoContainer");
      container.innerHTML = "";
      container.classList.remove("hidden");

      const hoyStr = new Date().toISOString().split('T')[0];

      // Caso 1: NO REGISTRADO
      if (!worker) {
        playAudioFeedback(false);
        container.innerHTML = `
          <div class="bg-red-950/40 border-2 border-red-600/60 rounded-2xl p-5 space-y-3 shadow-xl animate-pop">
            <div class="flex items-center gap-2.5 text-red-400">
              <div class="w-8 h-8 rounded-full bg-red-600/20 border border-red-500/40 flex items-center justify-center font-black text-lg">✕</div>
              <div>
                <h3 class="font-black text-base text-red-200 uppercase tracking-wide">NO REGISTRADO</h3>
                <p class="text-xs text-red-400 font-medium">DNI no registrado en el sistema SCTR</p>
              </div>
            </div>
            <p class="text-xs text-red-300/80 bg-red-900/30 p-3 rounded-xl border border-red-800/40">
              El trabajador con DNI <b>${dni}</b> no cuenta con póliza registrada en el directorio. Acceso denegado.
            </p>
          </div>
        `;
        return;
      }

      // Check date & status
      const hoy = new Date(hoyStr + 'T00:00:00');
      const vencimiento = new Date(worker.fecha_vencimiento + 'T00:00:00');
      const diffMs = vencimiento - hoy;
      const diasRestantes = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

      const isActivo = worker.activo && (diasRestantes >= 0);

      if (isActivo) {
        // Caso 2: SCTR VIGENTE / ACTIVO
        playAudioFeedback(true);
        currentValidatedWorker = {
          dni: worker.dni,
          nombre: worker.nombre_completo,
          codigo_casa: worker.codigo_casa,
          propietario: propietario
        };

        const badgeDiasText = diasRestantes === 0
          ? "Vence hoy mismo"
          : `${diasRestantes} día${diasRestantes === 1 ? '' : 's'} restantes`;

        container.innerHTML = `
          <div class="bg-emerald-950/40 border-2 border-emerald-500/80 rounded-2xl p-5 space-y-4 shadow-2xl animate-pop">
            
            <!-- Header Status -->
            <div class="flex items-center justify-between border-b border-emerald-800/50 pb-3">
              <div class="flex items-center gap-2 text-emerald-400">
                <div class="w-7 h-7 rounded-full bg-emerald-500/20 border border-emerald-400/40 flex items-center justify-center font-black text-base">✓</div>
                <span class="font-extrabold text-base tracking-wide text-emerald-300">SCTR VIGENTE</span>
              </div>
              <span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 text-[11px] font-black px-2.5 py-1 rounded-full">
                ${badgeDiasText}
              </span>
            </div>

            <!-- Details -->
            <div class="space-y-3 text-xs">
              <div>
                <span class="text-emerald-400/70 font-semibold uppercase text-[10px] block">Trabajador</span>
                <span class="text-white font-extrabold text-lg leading-tight block">${worker.nombre_completo}</span>
              </div>

              <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-800">
                <span class="text-slate-400 font-semibold uppercase text-[10px] block">Propietario</span>
                <span class="text-white font-bold text-sm block">${propietario}</span>
              </div>

              <div class="flex items-center justify-between text-[11px] text-emerald-300/80 pt-1">
                <span>Vigencia:</span>
                <span class="font-bold text-white">${formatearFechaTexto(worker.fecha_inicio)} al ${formatearFechaTexto(worker.fecha_vencimiento)}</span>
              </div>
            </div>

            <!-- BOTÓN DE INGRESO HABILITADO -->
            <button 
              onclick="confirmarIngreso()" 
              class="w-full bg-emerald-500 hover:bg-emerald-400 active:scale-[0.98] text-slate-950 font-black py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/25 flex items-center justify-center gap-2 transition-all uppercase tracking-wider text-sm mt-2"
            >
              <span>REGISTRAR INGRESO</span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </button>

          </div>
        `;
      } else {
        // Caso 3: SCTR VENCIDO
        playAudioFeedback(false);
        const diasVencido = Math.abs(diasRestantes);

        container.innerHTML = `
          <div class="bg-red-950/40 border-2 border-red-600/80 rounded-2xl p-5 space-y-4 shadow-xl animate-pop">
            
            <div class="flex items-center justify-between border-b border-red-800/50 pb-3">
              <div class="flex items-center gap-2 text-red-400">
                <div class="w-7 h-7 rounded-full bg-red-600/20 border border-red-500/40 flex items-center justify-center font-black text-base">✕</div>
                <span class="font-extrabold text-base tracking-wide text-red-200">SCTR VENCIDO</span>
              </div>
              <span class="bg-red-600/20 text-red-300 border border-red-500/40 text-[11px] font-black px-2.5 py-1 rounded-full">
                Vencido hace ${diasVencido} día${diasVencido === 1 ? '' : 's'}
              </span>
            </div>

            <div class="space-y-2 text-xs">
              <div>
                <span class="text-red-400/70 font-semibold uppercase text-[10px] block">Trabajador</span>
                <span class="text-white font-bold text-base leading-tight block">${worker.nombre_completo}</span>
              </div>

              <div class="grid grid-cols-2 gap-2 pt-1">
                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                  <span class="text-slate-400 font-semibold uppercase text-[9px] block">Casa / Lote</span>
                  <span class="text-white font-extrabold text-sm">${worker.codigo_casa}</span>
                </div>
                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                  <span class="text-slate-400 font-semibold uppercase text-[9px] block">Fecha Vencimiento</span>
                  <span class="text-red-400 font-bold text-xs block">${worker.fecha_vencimiento}</span>
                </div>
              </div>

              <p class="text-[11px] text-red-300/80 bg-red-900/20 p-2.5 rounded-xl border border-red-800/30 text-center font-medium">
                ⛔ No se puede registrar ingreso sin seguro SCTR vigente.
              </p>
            </div>

          </div>
        `;
      }
    }

    async function confirmarIngreso() {
      if (!currentValidatedWorker) return;

      const data = currentValidatedWorker;

      if (supabaseClient && !IS_DEMO) {
        await supabaseClient
          .from('historial_ingresos')
          .insert([{
            dni: data.dni,
            nombre_trabajador: data.nombre,
            codigo_casa: data.codigo_casa,
            propietario: data.propietario,
            estado: 'PERMITIDO',
            motivo: 'SCTR OK'
          }]);
      } else {
        // Local Demo save
        demoHistory.unshift({
          id: Date.now(),
          created_at: new Date().toISOString(),
          fecha_salida: null,
          dni: data.dni,
          nombre_trabajador: data.nombre,
          codigo_casa: data.codigo_casa,
          propietario: data.propietario,
          estado: 'PERMITIDO',
          motivo: 'SCTR OK'
        });
      }

      // Reset Form immediately
      document.getElementById("dniInput").value = "";
      document.getElementById("resultadoContainer").classList.add("hidden");
      currentValidatedWorker = null;

      // Refocus input
      document.getElementById("dniInput").focus();

      // Refresh background lists
      cargarTrabajadoresEnObra();
    }

    async function cargarTrabajadoresEnObra() {
      let activos = [];

      if (supabaseClient && !IS_DEMO) {
        const { data } = await supabaseClient
          .from('historial_ingresos')
          .select('*')
          .is('fecha_salida', null)
          .eq('estado', 'PERMITIDO')
          .order('created_at', { ascending: false });
        activos = data || [];
      } else {
        activos = demoHistory.filter(h => h.fecha_salida === null && h.estado === 'PERMITIDO');
      }

      window.cacheEnObra = activos;
      renderListaEnObra(activos);
    }

    function renderListaEnObra(items) {
      const container = document.getElementById("listaEnObra");
      const badgeNav = document.getElementById("navBadgeEnObra");
      const badgeCount = document.getElementById("badgeCountEnObra");

      // Update counter badges
      badgeCount.innerText = `${items.length} persona${items.length === 1 ? '' : 's'}`;
      if (items.length > 0) {
        badgeNav.innerText = items.length;
        badgeNav.classList.remove("hidden");
        badgeNav.classList.add("flex");
      } else {
        badgeNav.classList.add("hidden");
        badgeNav.classList.remove("flex");
      }

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-500 text-xs">
            No hay trabajadores dentro del condominio actualmente.
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(w => {
        // CÓDIGO NUEVO (Hora de Perú):
        const hora = new Date(w.created_at).toLocaleTimeString('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit' });
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between gap-3 shadow-md">
            <div class="space-y-0.5 min-w-0">
              <div class="flex items-center gap-2">
                <span class="bg-blue-600/20 text-blue-400 border border-blue-500/30 text-[10px] font-black px-2 py-0.5 rounded">
                  Casa ${w.codigo_casa}
                </span>
                <span class="text-[10px] text-slate-400 font-medium">Ingresó ${hora}</span>
              </div>
              <h4 class="font-bold text-white text-sm truncate">${w.nombre_trabajador}</h4>
              <p class="text-[11px] text-slate-400">DNI: ${w.dni}</p>
            </div>

            <button 
              onclick="marcarSalida(${w.id || `'${w.dni}'`})" 
              class="bg-amber-500/10 hover:bg-amber-500/20 active:scale-95 text-amber-400 border border-amber-500/30 px-3 py-2 rounded-xl text-xs font-bold shrink-0 transition-all flex items-center gap-1"
            >
              <span>Salida</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
              </svg>
            </button>
          </div>
        `;
      }).join('');
    }

    function filtrarTrabajadoresEnObra() {
      const q = document.getElementById("searchEnObra").value.toLowerCase().trim();
      if (!window.cacheEnObra) return;
      const filtrados = window.cacheEnObra.filter(w =>
        w.nombre_trabajador.toLowerCase().includes(q) ||
        w.dni.includes(q) ||
        w.codigo_casa.toLowerCase().includes(q)
      );
      renderListaEnObra(filtrados);
    }

    async function marcarSalida(idOrDni) {

      const horaPeru = new Date().toLocaleString("sv-SE", { timeZone: "America/Lima" });
      if (supabaseClient && !IS_DEMO) {
        if (typeof idOrDni === 'number') {
          await supabaseClient
            .from('historial_ingresos')
            .update({ fecha_salida: horaPeru })
            .eq('id', idOrDni);
        } else {
          await supabaseClient
            .from('historial_ingresos')
            .update({ fecha_salida: horaPeru })
            .eq('dni', idOrDni)
            .is('fecha_salida', null);
        }
      } else {
        const item = demoHistory.find(h => (h.id === idOrDni || h.dni === idOrDni) && h.fecha_salida === null);
        if (item) {
          item.fecha_salida = horaPeru;
        }
      }

      cargarTrabajadoresEnObra();
      cargarHistorial();
    }

    async function cargarHistorial() {
      let historial = [];

      if (supabaseClient && !IS_DEMO) {
        const { data } = await supabaseClient
          .from('historial_ingresos')
          .select('*')
          .order('created_at', { ascending: false })
          .limit(40);
        historial = data || [];
      } else {
        historial = [...demoHistory];
      }

      window.cacheHistorial = historial;
      renderListaHistorial(historial);
    }

    function renderListaHistorial(items) {
      const container = document.getElementById("listaHistorial");

      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 bg-slate-900 border border-slate-800 rounded-2xl p-4 text-slate-500 text-xs">
            Sin registros en el historial.
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(h => {
        // CÓDIGO NUEVO (Hora y Fecha de Perú):
        const fecha = new Date(h.created_at).toLocaleDateString('es-PE', { timeZone: 'America/Lima', day: '2-digit', month: '2-digit' });
        const horaEntrada = new Date(h.created_at).toLocaleTimeString('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit' });
        const horaSalida = h.fecha_salida
          ? new Date(h.fecha_salida).toLocaleTimeString('es-PE', { timeZone: 'America/Lima', hour: '2-digit', minute: '2-digit' })
          : '<span class="text-emerald-400 font-bold">En Obra</span>';

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 space-y-1 shadow-sm text-xs">
            <div class="flex items-center justify-between">
              <span class="font-bold text-white text-sm">${h.nombre_trabajador}</span>
              <span class="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded">
                Casa ${h.codigo_casa}
              </span>
            </div>
            
            <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-800/60">
              <span>DNI: ${h.dni} • ${fecha}</span>
              <span>In: <b>${horaEntrada}</b> | Out: <b>${horaSalida}</b></span>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrarHistorial() {
      const q = document.getElementById("searchHistorial").value.toLowerCase().trim();
      if (!window.cacheHistorial) return;
      const filtrados = window.cacheHistorial.filter(h =>
        h.nombre_trabajador.toLowerCase().includes(q) ||
        h.dni.includes(q) ||
        h.codigo_casa.toLowerCase().includes(q)
      );
      renderListaHistorial(filtrados);
    }

    function switchTab(tab) {
      document.getElementById("tab-validar").classList.add("hidden");
      document.getElementById("tab-en-obra").classList.add("hidden");
      document.getElementById("tab-historial").classList.add("hidden");

      // Reset Nav button colors
      document.getElementById("navBtnValidar").className = "flex flex-col items-center justify-center gap-1 text-slate-400 font-medium text-[11px] transition-colors";
      document.getElementById("navBtnEnObra").className = "flex flex-col items-center justify-center gap-1 text-slate-400 font-medium text-[11px] transition-colors relative";
      document.getElementById("navBtnHistorial").className = "flex flex-col items-center justify-center gap-1 text-slate-400 font-medium text-[11px] transition-colors";

      if (tab === 'validar') {
        document.getElementById("tab-validar").classList.remove("hidden");
        document.getElementById("navBtnValidar").className = "flex flex-col items-center justify-center gap-1 text-blue-500 font-bold text-[11px] transition-colors";
        document.getElementById("dniInput").focus();
      } else if (tab === 'en-obra') {
        document.getElementById("tab-en-obra").classList.remove("hidden");
        document.getElementById("navBtnEnObra").className = "flex flex-col items-center justify-center gap-1 text-blue-500 font-bold text-[11px] transition-colors relative";
        cargarTrabajadoresEnObra();
      } else if (tab === 'historial') {
        document.getElementById("tab-historial").classList.remove("hidden");
        document.getElementById("navBtnHistorial").className = "flex flex-col items-center justify-center gap-1 text-blue-500 font-bold text-[11px] transition-colors";
        cargarHistorial();
      }
    }

    function openSettingsModal() {
      document.getElementById("cfgUrl").value = SUPABASE_URL;
      document.getElementById("cfgKey").value = SUPABASE_KEY;
      document.getElementById("cfgDemo").checked = IS_DEMO;
      document.getElementById("settingsModal").classList.remove("hidden");
    }

    function closeSettingsModal() {
      document.getElementById("settingsModal").classList.add("hidden");
    }

    function saveSettings() {
      SUPABASE_URL = document.getElementById("cfgUrl").value.trim();
      SUPABASE_KEY = document.getElementById("cfgKey").value.trim();
      IS_DEMO = document.getElementById("cfgDemo").checked;

      localStorage.setItem("tot_supa_url", SUPABASE_URL);
      localStorage.setItem("tot_supa_key", SUPABASE_KEY);
      localStorage.setItem("tot_demo", IS_DEMO);

      initSupabase();
      closeSettingsModal();
      alert("Configuración actualizada.");
    }

    // Trigger validation on Enter key press
    document.getElementById("dniInput").addEventListener("keypress", function (e) {
      if (e.key === "Enter") validarDNI();
    });

    // App Startup
    initSupabase();
    cargarTrabajadoresEnObra();
  </script>

</body>

</html>
